# Daily PO delivery reminder pass (PRD §10, M1).
#
# This is the production scheduler: it calls the backend's protected
# POST /api/v1/internal/run-reminders once a day. Nothing runs inside the API
# process, so this works even when the backend has scaled to zero — the call
# itself wakes it.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BACKEND_BASE_URL   e.g. https://po-tracker-api.onrender.com   (no trailing slash)
#   CRON_SECRET        must match the backend's CRON_SECRET env var
#
# Target send time is 10:00 UK local (Europe/London). GitHub cron is UTC only
# and does no DST, so we fire at BOTH 09:00 and 10:00 UTC and the job itself
# no-ops unless it's currently 10:00 in London — that's 09:00 UTC under BST
# (summer) and 10:00 UTC under GMT (winter). The backend's per-day de-dup log
# makes the "wrong" run harmless anyway. GitHub cron can lag the minute by a
# few minutes — fine for a once-a-day job.

name: Daily PO reminders

on:
  schedule:
    - cron: "0 9,10 * * *" # 09:00 & 10:00 UTC — the job keeps only the 10:00 London one
  workflow_dispatch: {} # allow a manual run from the Actions tab (skips the time gate)

concurrency:
  group: po-reminders
  cancel-in-progress: false

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Only continue at 10:00 UK time
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ="Europe/London" date +%H)
          echo "London hour is ${hour}"
          if [ "${hour}" != "10" ]; then
            echo "Not 10:00 in London — skipping this run."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Trigger reminder run
        if: env.SKIP != '1'
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::BACKEND_BASE_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi
          code=$(curl -sS --max-time 300 --retry 2 --retry-delay 30 \
            -o /tmp/response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BACKEND_BASE_URL%/}/api/v1/internal/run-reminders")
          echo "HTTP ${code}"
          cat /tmp/response.json || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::run-reminders returned HTTP ${code}"
            exit 1
          fi
